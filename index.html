<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bitcoinix</title>
  <link rel="icon" type="image/png" href="logo.png">
  <meta name="description" content="bitcoinix – this site is under construction.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #666666;
      --accent: #f7931a;
      --surface: #fafafa;
      --border: #e5e5e5;
      --link-hover: #fff7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --fg: #eeeeee;
        --muted: #aaaaaa;
        --surface: #1a1a1a;
        --border: #333333;
        --link-hover: #2a2116;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 36rem;
      padding: 1rem;
      text-align: center;
    }
    .logo {
      width: 100%;
      max-width: 24rem;
      height: auto;
      margin-bottom: 2rem;
    }
    .links {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
      list-style: none;
      padding: 0;
      margin: 4rem 0 0;
    }
    .link-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: 1.25rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      background: var(--surface);
      color: var(--fg);
      text-decoration: none;
      transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }
    .link-icon {
      width: 1.75rem;
      height: 1.75rem;
      flex-shrink: 0;
      fill: currentColor;
    }
    .link-label {
      display: block;
      font-size: 0.9375rem;
      font-weight: 600;
    }
    .link-description {
      display: block;
      margin-top: 0.25rem;
      color: var(--muted);
      font-size: 0.8125rem;
    }
    .link-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-color: var(--accent);
      background: var(--link-hover);
    }
    .link-card:focus-visible .link-icon {
      color: var(--accent);
    }
    @media (hover: hover) {
      .link-card:hover {
        border-color: var(--accent);
        background: var(--link-hover);
        transform: translateY(-3px);
      }
      .link-card:hover .link-icon {
        color: var(--accent);
      }
    }
    @media (max-width: 34rem) {
      .links {
        grid-template-columns: 1fr;
      }
      .link-card {
        flex-direction: row;
        gap: 1rem;
        padding: 1rem 1.25rem;
        text-align: left;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .link-card,
      .link-card:hover {
        transition: none;
        transform: none;
      }
    }
  </style>
</head>
