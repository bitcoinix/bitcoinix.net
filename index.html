<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bitcoinix</title>
  <meta name="description" content="bitcoinix – this site is under construction.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #666666;
      --accent: #f7931a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --fg: #eeeeee;
        --muted: #aaaaaa;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 36rem;
      padding: 1rem;
      text-align: center;
    }
    .logo {
      width: 100%;
      max-width: 24rem;
      height: auto;
      margin-bottom: 2rem;
    }
    .notice {
      color: var(--muted);
      margin-top: 0;
    }
    ul {
      list-style: none;
      padding: 0;
      margin-top: 2rem;
    }
    li { margin: 0.5rem 0; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo-text.png" alt="bitcoinix" width="1140" height="288">
    <p class="notice">🚧 This site is under construction. Please check back later.</p>
    <ul>
      <li><a href="https://github.com/bitcoinix/bitcoinix/" rel="noopener">bitcoinix org on GitHub</a></li>
      <li><a href="https://docs.bitcoinix.net/" rel="noopener">bitcoinix documentation</a></li>
      <li><a href="https://x.com/bitcoinix_net" rel="noopener">@bitcoinix_net on X</a></li>
    </ul>
  </main>
</body>
</html>
